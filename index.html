<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="wrap">
    <h1>Gallery</h1>
    <p class="sub">Photos + videos. Updated often.</p>
  </header>

  <main class="wrap">
    <section>
      <h2>Videos</h2>
      <div id="videos" class="grid"></div>
    </section>

    <section>
      <h2>Photos</h2>
      <div id="photos" class="grid"></div>
    </section>
  </main>

  <dialog id="lightbox">
    <button id="closeBtn" aria-label="Close">×</button>
    <div id="lightboxBody"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
